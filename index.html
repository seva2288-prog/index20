<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квантум 2.3 AI</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:sans-serif;background:#0b0e14;color:#e0e0e0;max-width:480px;margin:0 auto;padding:16px}
        .card{background:#1a1f2a;border-radius:12px;padding:16px;margin:8px 0}
        .row{display:flex;gap:8px}
        .row .field{flex:1}
        input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #2a3140;background:#0b0e14;color:#fff;font-size:16px}
        .btn{width:100%;padding:14px;border-radius:10px;border:0;font-weight:700;font-size:16px;cursor:pointer;background:#f7931a;color:#000}
        .btn:active{transform:scale(.97)}
        .btn-api{background:#3498db;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border-radius:10px;border:0;font-weight:700;font-size:16px;cursor:pointer;margin:4px 0}
        .btn-api:disabled{opacity:.5}
        .result{background:#1a2a3a;padding:10px;border-radius:8px;margin:8px 0;font-size:13px}
        .match{background:#1a1f2a;padding:4px 8px;border-radius:4px;margin:2px 0;display:flex;justify-content:space-between}
        .green{color:#2ecc71}
        .red{color:#e74c3c}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:8px 20px;border-radius:12px;background:#1a2a3a;color:#f7931a;border:1px solid #f7931a;z-index:999}
        .status{color:#888;font-size:12px;margin-top:8px}
        .h2h-item{background:#1a1f2a;border:1px solid #2a3140;border-radius:6px;padding:4px 8px;font-size:11px;display:inline-flex;align-items:center;gap:4px;margin:2px}
        .h2h-item .oz{color:#2ecc71}
        .h2h-item .no-oz{color:#e74c3c}
        .h2h-summary{background:#1a2a3a;border-radius:8px;padding:6px 10px;margin:4px 0;font-size:12px;display:flex;flex-wrap:wrap;gap:8px}
        .h2h-summary .item{background:#0b0e14;padding:4px 10px;border-radius:12px;border:1px solid #2a3140}
        .h2h-summary .item .num{font-weight:700;color:#f7931a}
        .spinner{display:inline-block;width:18px;height:18px;border:2px solid #fff;border-radius:50%;border-top-color:transparent;animation:spin .8s linear infinite}
        @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
        h1{color:#f7931a}
        .top-tabs{display:flex;gap:4px;margin:8px 0;border-bottom:1px solid #2a3140;padding-bottom:8px}
        .top-tab{padding:8px 16px;border-radius:8px;cursor:pointer;background:0;border:0;color:#888;font-size:14px}
        .top-tab.active{color:#f7931a;font-weight:700;border-bottom:2px solid #f7931a}
        .tab{display:none}
        .tab.active{display:block}
        .result-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;text-align:center;margin:8px 0}
        .result-grid .value{font-size:20px;font-weight:700;color:#f7931a}
        .result-grid .label{font-size:9px;color:#888}
        .confidence-bar{background:#1a1f2a;border-radius:6px;height:6px;margin:4px 0;overflow:hidden}
        .confidence-bar .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#e74c3c,#f1c40f,#2ecc71)}
        .advice{padding:8px 10px;border-radius:8px;margin:4px 0;text-align:center;font-weight:600;font-size:14px;border-left:4px solid #2ecc71}
        .advice.info{background:#1a2a3a;border-left-color:#f7931a;color:#f7931a}
        .advice.good{background:#1a3a1a;border-left-color:#2ecc71;color:#2ecc71}
        .advice.warn{background:#2a2a1a;border-left-color:#f1c40f;color:#f1c40f}
        .advice.bad{background:#2a1a1a;border-left-color:#e74c3c;color:#e74c3c}
        .mode-wrap{display:flex;gap:4px;margin:6px 0}
        .mode-btn{flex:1;padding:8px;border-radius:8px;border:1px solid #2a3140;background:#1a1f2a;color:#888;cursor:pointer}
        .mode-btn.active{background:#f7931a;color:#000;border-color:#f7931a}
        .total-display{background:#1a1f2a;padding:10px;border-radius:8px;text-align:center;margin:4px 0;border:1px solid #2a3140}
        .total-display .value{font-size:24px;font-weight:700;color:#f7931a}
        .total-display .label{font-size:10px;color:#888}
        .action-row{display:flex;gap:8px}
        .btn-save{background:#2ecc71;color:#000;flex:2}
        .btn-clear{background:#3a1a1a;color:#ff8a8a;flex:1}
        .btn-calc{background:#f7931a;color:#000}
    </style>
</head>
<body>

<h1>⚛️ Квантум <span style="font-size:12px;color:#555">v2.3 AI</span></h1>

<div class="top-tabs">
    <button class="top-tab active" onclick="switchTab('analysis')">📊 Анализ</button>
    <button class="top-tab" onclick="switchTab('search')">🔍 Поиск</button>
    <button class="top-tab" onclick="switchTab('stats')">📈 Статистика</button>
    <button class="top-tab" onclick="switchTab('settings')">⚙️ Настройки</button>
</div>

<!-- АНАЛИЗ -->
<div id="analysis" class="tab active">
    <div class="card">
        <div class="row">
            <div class="field">
                <label style="color:#888;font-size:10px">🏠 Хозяева</label>
                <input type="number" id="homeGoals" value="0" min="0">
            </div>
            <div class="field">
                <label style="color:#888;font-size:10px">✈️ Гости</label>
                <input type="number" id="awayGoals" value="0" min="0">
            </div>
        </div>
    </div>
    <div class="mode-wrap">
        <button class="mode-btn active" data-mode="total" onclick="switchMode('total',this)">⚽ Тотал</button>
        <button class="mode-btn" data-mode="fora" onclick="switchMode('fora',this)">⚖️ Фора</button>
        <button class="mode-btn" data-mode="oz" onclick="switchMode('oz',this)">⚽ ОЗ</button>
    </div>
    <div class="total-display">
        <div class="label">📈 Сумма голов</div>
        <div class="value" id="sumDisplay">0</div>
    </div>
    <button class="btn btn-calc" onclick="calculate()">⚡ Рассчитать</button>
    <div class="action-row">
        <button class="btn btn-save" onclick="saveBet()">💾 Записать</button>
        <button class="btn btn-clear" onclick="clearAll()">🗑️ Очистить</button>
    </div>
    <div class="card">
        <div class="result-grid">
            <div><div class="label" id="resLabel1">Ожидаемый</div><div class="value" id="resValue1">--</div></div>
            <div><div class="label">Линия БК</div><div class="value" id="resValue2">--</div></div>
            <div><div class="label">Разница</div><div class="value" id="resValue3">--</div></div>
        </div>
        <div class="advice info" id="resAdvice">⏳ Введите данные</div>
        <div style="display:flex;justify-content:space-between;font-size:10px;color:#888;margin-top:4px;">
            <span>📊 Индекс доверия</span>
            <span id="confidenceLabel">0%</span>
        </div>
        <div class="confidence-bar"><div class="fill" id="confidenceFill" style="width:0%"></div></div>
    </div>
    <div class="card" id="xgCard" style="display:none;">
        <div style="font-weight:700;color:#f7931a">🎯 xG</div>
        <div class="row" style="margin-top:8px">
            <div class="field" style="text-align:center"><span style="color:#2ecc71;font-size:18px;font-weight:700" id="xgHome">0.00</span><div style="color:#888;font-size:8px">xG Хозяев</div></div>
            <div class="field" style="text-align:center"><span style="color:#3498db;font-size:18px;font-weight:700" id="xgAway">0.00</span><div style="color:#888;font-size:8px">xG Гостей</div></div>
        </div>
    </div>
</div>

<!-- ПОИСК -->
<div id="search" class="tab">
    <div class="card">
        <div style="font-weight:700;color:#f7931a;margin-bottom:8px">🔍 Поиск H2H</div>
        <div class="row">
            <div class="field">
                <label style="color:#888;font-size:10px">🏠 Хозяева</label>
                <input type="text" id="homeTeam" placeholder="Real Madrid">
            </div>
            <div class="field">
                <label style="color:#888;font-size:10px">✈️ Гости</label>
                <input type="text" id="awayTeam" placeholder="Barcelona">
            </div>
        </div>
        <button class="btn-api" onclick="loadH2H()">📊 Загрузить H2H</button>
        <div id="h2hStatus" class="status">Введите команды</div>
        <div id="h2hResults"></div>
    </div>
</div>

<!-- СТАТИСТИКА -->
<div id="stats" class="tab">
    <div class="card">
        <div style="font-weight:700;color:#f7931a;margin-bottom:8px">📊 Статистика</div>
        <div class="row">
            <div class="field" style="text-align:center"><div style="font-size:20px;font-weight:700;color:#f7931a" id="statTotal">0</div><div style="color:#888;font-size:9px">Всего</div></div>
            <div class="field" style="text-align:center"><div style="font-size:20px;font-weight:700;color:#f7931a" id="statWinRate">0%</div><div style="color:#888;font-size:9px">Винрейт</div></div>
            <div class="field" style="text-align:center"><div style="font-size:20px;font-weight:700;color:#f7931a" id="statBalance">0</div><div style="color:#888;font-size:9px">Баланс</div></div>
        </div>
    </div>
    <div style="margin-top:8px">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px">
            <span style="color:#f7931a;font-weight:700">📜 История</span>
            <button onclick="clearHistory()" style="background:#5a1a1a;color:#ff8a8a;border:0;padding:2px 10px;border-radius:12px;cursor:pointer">🗑️</button>
        </div>
        <div id="historyList"><div style="color:#555;text-align:center;padding:10px 0">Нет ставок</div></div>
    </div>
</div>

<!-- НАСТРОЙКИ -->
<div id="settings" class="tab">
    <div class="card">
        <div style="font-weight:700;color:#f7931a;margin-bottom:8px">⚙️ Настройки</div>
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #2a3140">
            <span style="color:#888;font-size:13px">🎨 Тема</span>
            <button onclick="toggleTheme()" style="background:#2a3140;border:0;color:#fff;padding:4px 12px;border-radius:12px;cursor:pointer">🌙 Тёмная</button>
        </div>
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #2a3140">
            <span style="color:#888;font-size:13px">🗑️ Сброс</span>
            <button onclick="resetAll()" style="padding:6px 16px;border-radius:8px;border:1px solid #e74c3c;background:0;color:#e74c3c;cursor:pointer">Сбросить</button>
        </div>
        <div style="text-align:center;font-size:10px;color:#555;margin-top:8px;padding-top:8px;border-top:1px solid #2a3140">⚛️ Квантум v2.3 AI</div>
    </div>
</div>

<script>
// ================================================================
// КВАНТУМ 2.3 AI — H2H ЧЕРЕЗ THESPORTSDB (БЕСПЛАТНО)
// ================================================================

let state = {
    bets: JSON.parse(localStorage.getItem('quantum_bets') || '[]'),
    currentMode: 'total',
    h2hData: null,
    understatData: null
};

function $(id) { return document.getElementById(id); }
function safeNum(v) { var n = parseFloat(v); return isNaN(n) ? 0 : n; }

function showToast(msg) {
    var old = document.querySelector('.toast');
    if (old) old.remove();
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function() { if (t.parentNode) t.remove(); }, 3000);
}

function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(function(el) { el.classList.remove('active'); });
    document.getElementById(tab).classList.add('active');
    document.querySelectorAll('.top-tab').forEach(function(el) { el.classList.remove('active'); });
    var idx = ['analysis','search','stats','settings'].indexOf(tab);
    document.querySelectorAll('.top-tab')[idx].classList.add('active');
    if (tab === 'stats') renderStats();
}

function toggleTheme() {
    var body = document.body;
    if (body.style.background === '#f0f2f5' || body.classList.contains('light')) {
        body.style.background = '#0b0e14';
        body.style.color = '#e0e0e0';
        body.classList.remove('light');
    } else {
        body.style.background = '#f0f2f5';
        body.style.color = '#1a1a1a';
        body.classList.add('light');
    }
}

function switchMode(mode, btn) {
    state.currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    var labels = { 'total': 'Ожидаемый тотал', 'fora': 'Ожидаемая фора', 'oz': 'Обе забьют' };
    $('resLabel1').textContent = labels[mode] || 'Ожидаемый';
    $('resValue1').textContent = '--';
    $('resValue2').textContent = '--';
    $('resValue3').textContent = '--';
    $('resAdvice').textContent = '⏳ Введите данные';
    $('resAdvice').className = 'advice info';
    $('confidenceLabel').textContent = '0%';
    $('confidenceFill').style.width = '0%';
    if (safeNum($('homeGoals').value) > 0 || safeNum($('awayGoals').value) > 0 || (state.h2hData && state.h2hData.length > 0)) calculate();
}

// ================================================================
// ГЛАВНАЯ ФУНКЦИЯ — H2H ЧЕРЕЗ THESPORTSDB
// ================================================================

async function loadH2H() {
    var home = $('homeTeam').value.trim();
    var away = $('awayTeam').value.trim();
    if (!home || !away) { showToast('⚠️ Введите обе команды'); return; }

    var status = $('h2hStatus');
    var results = $('h2hResults');
    status.textContent = '⏳ Загрузка...';
    results.innerHTML = '';

    try {
        // TheSportsDB — бесплатно, без ключа
        var url = 'https://www.thesportsdb.com/api/v1/json/3/eventspast.php?t=' + encodeURIComponent(home) + '&s=' + encodeURIComponent(away);
        var resp = await fetch(url);
        var data = await resp.json();

        if (!data.events || data.events.length === 0) {
            status.textContent = '❌ Нет очных встреч';
            showToast('⚠️ Нет данных', 'error');
            return;
        }

        var matches = data.events.map(function(m) {
            return {
                home: m.strHomeTeam || home,
                away: m.strAwayTeam || away,
                homeScore: parseInt(m.intHomeScore) || 0,
                awayScore: parseInt(m.intAwayScore) || 0,
                oz: (parseInt(m.intHomeScore) || 0) > 0 && (parseInt(m.intAwayScore) || 0) > 0,
                total: (parseInt(m.intHomeScore) || 0) + (parseInt(m.intAwayScore) || 0),
                diff: (parseInt(m.intHomeScore) || 0) - (parseInt(m.intAwayScore) || 0)
            };
        });

        state.h2hData = matches;

        var total = matches.length;
        var ozCount = 0;
        for (var i = 0; i < matches.length; i++) { if (matches[i].oz) ozCount++; }
        var sumTotal = 0;
        for (var j = 0; j < matches.length; j++) { sumTotal += matches[j].total; }
        var avgTotal = (sumTotal / total).toFixed(1);
        var homeWins = 0, awayWins = 0, draws = 0;
        for (var k = 0; k < matches.length; k++) {
            if (matches[k].homeScore > matches[k].awayScore) homeWins++;
            else if (matches[k].awayScore > matches[k].homeScore) awayWins++;
            else draws++;
        }
        var ozPercent = Math.round((ozCount / total) * 100);

        var html = '<div class="h2h-summary">';
        html += '<span class="item">📊 Всего: <span class="num">' + total + '</span></span>';
        html += '<span class="item">⚽ ОЗ: <span class="num">' + ozPercent + '%</span></span>';
        html += '<span class="item">📈 Тотал: <span class="num">' + avgTotal + '</span></span>';
        html += '<span class="item">🏠 ' + homeWins + ' | ✈️ ' + awayWins + ' | 🤝 ' + draws + '</span>';
        html += '</div>';

        var matchesHtml = '';
        for (var m = 0; m < Math.min(5, matches.length); m++) {
            var ozClass = matches[m].oz ? 'oz' : 'no-oz';
            var ozText = matches[m].oz ? '✅' : '❌';
            matchesHtml += '<div class="h2h-item"><span class="score">' + matches[m].home + ' ' + matches[m].homeScore + ':' + matches[m].awayScore + ' ' + matches[m].away + '</span><span class="' + ozClass + '">' + ozText + '</span></div>';
        }

        results.innerHTML = html + matchesHtml;
        status.textContent = '✅ Найдено ' + total + ' встреч (TheSportsDB)';
        showToast('✅ Загружено ' + total + ' матчей!', 'success');

        // Автоматический расчёт
        if (state.h2hData.length > 0) calculate();

    } catch (e) {
        status.textContent = '❌ Ошибка: ' + e.message;
        showToast('⚠️ Ошибка загрузки', 'error');
        console.error(e);
    }
}

// ================================================================
// РАСЧЁТ
// ================================================================

function calculate() {
    var home = safeNum($('homeGoals').value);
    var away = safeNum($('awayGoals').value);
    var total = home + away;
    var mode = state.currentMode;

    if (total === 0 && (!state.h2hData || state.h2hData.length === 0)) {
        $('resValue1').textContent = '--';
        $('resValue2').textContent = '--';
        $('resValue3').textContent = '--';
        $('resAdvice').textContent = '⏳ Введите данные';
        $('resAdvice').className = 'advice info';
        $('confidenceLabel').textContent = '0%';
        $('confidenceFill').style.width = '0%';
        return;
    }

    var result = { value: 0, prob: 50, advice: '', className: 'info' };

    if (mode === 'oz') {
        var ozProb = home > 0 && away > 0 ? 75 : 50;
        result.value = home > 0 && away > 0 ? '✅ Да' : '❌ Нет';
        result.prob = ozProb;
        result.advice = ozProb > 70 ? '✅ Высокая ' + ozProb + '%' : (ozProb > 40 ? '🟡 Средняя ' + ozProb + '%' : '🔴 Низкая ' + ozProb + '%');
        result.className = ozProb > 70 ? 'good' : (ozProb > 40 ? 'warn' : 'bad');
    } else if (mode === 'total') {
        var expected = total || 2.5;
        if (state.h2hData && state.h2hData.length > 0) {
            var sumT = 0;
            for (var i = 0; i < state.h2hData.length; i++) { sumT += state.h2hData[i].total; }
            expected = (expected + sumT / state.h2hData.length) / 2;
        }
        expected = Math.round(expected);
        result.value = expected;
        result.prob = 50 + Math.min(Math.abs(expected - 2.5) * 5, 30);
        result.advice = '📊 Ожидаемый тотал: ' + expected;
        result.className = 'info';
    } else if (mode === 'fora') {
        var fora = total ? Math.round((home - away) / 2) : 0;
        if (state.h2hData && state.h2hData.length > 0) {
            var sumD = 0;
            for (var j = 0; j < state.h2hData.length; j++) { sumD += state.h2hData[j].diff; }
            fora = Math.round((fora + sumD / state.h2hData.length) / 2);
        }
        result.value = (fora >= 0 ? '+' : '') + fora;
        result.prob = 50 + Math.min(Math.abs(fora) * 10, 30);
        result.advice = '📊 Ожидаемая фора: ' + result.value;
        result.className = 'info';
    }

    $('resValue1').textContent = result.value;
    $('resValue2').textContent = '--';
    $('resValue3').textContent = '--';
    $('resAdvice').textContent = result.advice;
    $('resAdvice').className = 'advice ' + result.className;
    var confidence = Math.min(100, Math.max(0, Math.round(result.prob + (state.understatData ? 5 : 0))));
    $('confidenceLabel').textContent = confidence + '%';
    $('confidenceFill').style.width = confidence + '%';
    $('sumDisplay').textContent = total;
}

function updateSum() {
    var total = safeNum($('homeGoals').value) + safeNum($('awayGoals').value);
    $('sumDisplay').textContent = total;
}

// ================================================================
// СТАВКИ
// ================================================================

function saveBet() {
    var bet = {
        id: Date.now(),
        date: new Date().toLocaleString(),
        match: ($('homeTeam').value || 'Хозяева') + ' - ' + ($('awayTeam').value || 'Гости'),
        mode: state.currentMode,
        value: $('resValue1').textContent || '--',
        home: safeNum($('homeGoals').value),
        away: safeNum($('awayGoals').value),
        confidence: parseInt($('confidenceLabel').textContent) || 50,
        outcome: 'pending',
        resultText: '⏳ Ожидание'
    };
    state.bets.push(bet);
    localStorage.setItem('quantum_bets', JSON.stringify(state.bets));
    renderStats();
    showToast('✅ Ставка сохранена!');
}

function editBet(index) {
    var b = state.bets[index];
    if (!b) return;
    var choice = prompt('Исход:\n1 - Выиграла\n2 - Проиграла\n3 - Неизвестно', '3');
    if (choice === null) return;
    if (choice === '1') { b.outcome = 'win'; b.resultText = '✅ Выигрыш'; }
    else if (choice === '2') { b.outcome = 'loss'; b.resultText = '❌ Проигрыш'; }
    else { b.outcome = 'pending'; b.resultText = '⏳ Ожидание'; }
    localStorage.setItem('quantum_bets', JSON.stringify(state.bets));
    renderStats();
    showToast('✅ Обновлено');
}

function clearHistory() {
    if (!confirm('Удалить историю?')) return;
    state.bets = [];
    localStorage.setItem('quantum_bets', JSON.stringify(state.bets));
    renderStats();
    showToast('🗑️ История очищена');
}

function resetAll() {
    if (!confirm('Сбросить всё?')) return;
    localStorage.clear();
    location.reload();
}

function clearAll() {
    $('homeGoals').value = '0';
    $('awayGoals').value = '0';
    $('sumDisplay').textContent = '0';
    $('resValue1').textContent = '--';
    $('resValue2').textContent = '--';
    $('resValue3').textContent = '--';
    $('resAdvice').textContent = '⏳ Введите данные';
    $('resAdvice').className = 'advice info';
    $('confidenceLabel').textContent = '0%';
    $('confidenceFill').style.width = '0%';
    $('h2hResults').innerHTML = '';
    $('h2hStatus').textContent = 'Введите команды';
    state.h2hData = null;
    state.understatData = null;
    showToast('🗑️ Очищено');
}

function renderStats() {
    var total = state.bets.length;
    var wins = 0, losses = 0;
    for (var i = 0; i < state.bets.length; i++) {
        if (state.bets[i].outcome === 'win') wins++;
        else if (state.bets[i].outcome === 'loss') losses++;
    }
    $('statTotal').textContent = total;
    $('statWinRate').textContent = (wins + losses) > 0 ? Math.round((wins / (wins + losses)) * 100) + '%' : '0%';
    $('statBalance').textContent = wins - losses;

    var list = $('historyList');
    if (state.bets.length === 0) {
        list.innerHTML = '<div style="color:#555;text-align:center;padding:10px 0">Нет ставок</div>';
        return;
    }
    var names = { 'total': 'Тотал', 'fora': 'Фора', 'oz': 'ОЗ' };
    var html = '';
    for (var j = state.bets.length - 1; j >= 0; j--) {
        var b = state.bets[j];
        var cls = b.outcome === 'win' ? 'win' : (b.outcome === 'loss' ? 'loss' : 'pending');
        var emoji = b.outcome === 'win' ? '✅' : (b.outcome === 'loss' ? '❌' : '⏳');
        html += '<div class="match" onclick="editBet(' + j + ')"><div><b>' + (names[b.mode] || b.mode) + '</b>: ' + b.value + '</div><div><span class="' + cls + '">' + emoji + ' ' + (b.resultText || '⏳') + '</span></div></div>';
    }
    list.innerHTML = html;
}

// Инициализация
document.addEventListener('DOMContentLoaded', function() {
    renderStats();
    $('homeGoals').addEventListener('input', function() { updateSum(); if (safeNum(this.value) > 0 || safeNum($('awayGoals').value) > 0 || (state.h2hData && state.h2hData.length > 0)) calculate(); });
    $('awayGoals').addEventListener('input', function() { updateSum(); if (safeNum($('homeGoals').value) > 0 || safeNum(this.value) > 0 || (state.h2hData && state.h2hData.length > 0)) calculate(); });
    console.log('⚛️ КВАНТУМ 2.3 AI ЗАГРУЖЕН');
    console.log('✅ H2H через TheSportsDB (бесплатно)');
});
</script>
