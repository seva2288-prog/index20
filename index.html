<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Таблица лиги</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #fff; padding: 20px; margin: 0; }
        h1 { text-align: center; color: #bb86fc; margin-bottom: 30px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .controls { display: flex; gap: 15px; justify-content: center; margin-bottom: 25px; flex-wrap: wrap; }
        select, button { padding: 12px 20px; border-radius: 8px; border: none; font-size: 16px; background: #2d2d2d; color: #fff; cursor: pointer; }
        button { background: #bb86fc; color: #121212; font-weight: bold; transition: 0.2s; }
        button:hover { background: #9a6fd4; }
        table { width: 100%; border-collapse: collapse; background: #1e1e1e; border-radius: 12px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #333; color: #bb86fc; }
        tr:hover { background: #2a2a2a; }
        .loader { text-align: center; margin: 20px; display: none; color: #aaa; }
        .error { text-align: center; color: #ff5252; display: none; }
        img { width: 24px; height: 24px; vertical-align: middle; margin-right: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚽ Футбольная таблица</h1>
        <div class="controls">
            <select id="leagueSelect">
                <option value="135">Англия (EPL)</option>
                <option value="140">Испания (La Liga)</option>
                <option value="135">Италия (Serie A)</option>
                <option value="78">Германия (Bundesliga)</option>
            </select>
            <input type="text" id="seasonInput" value="2024" style="padding: 12px 20px; border-radius: 8px; border: none; font-size: 16px; background: #2d2d2d; color: #fff;">
            <button onclick="loadStandings()">Загрузить таблицу</button>
        </div>
        <div id="loader" class="loader">⏳ Загрузка таблицы...</div>
        <div id="error" class="error">❌ Ошибка загрузки. Проверьте ссылку.</div>
        <div id="results"></div>
    </div>

    <script>
        async function loadStandings() {
            const league = document.getElementById('leagueSelect').value;
            const season = document.getElementById('seasonInput').value;
            const loader = document.getElementById('loader');
            const errorDiv = document.getElementById('error');
            const results = document.getElementById('results');

            loader.style.display = 'block';
            errorDiv.style.display = 'none';
            results.innerHTML = '';

            try {
                // ВАЖНО: Замените ссылку ниже на адрес вашего Render сервера
                const res = await fetch(`https://oz-proxy-clean.onrender.com/api/matches/${league}/${season}`);
                if (!res.ok) throw new Error('Ошибка сети');
                const data = await res.json();

                if (data && data.response && data.response.length > 0) {
                    // Берем первый массив лиги (там есть все команды)
                    const standings = data.response[0].league.standings[0]; 
                    
                    let html = `<table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Команда</th>
                                <th>И</th>
                                <th>В</th>
                                <th>Н</th>
                                <th>П</th>
                                <th>Голы</th>
                                <th>РМ</th>
                                <th>Очки</th>
                            </tr>
                        </thead>
                        <tbody>`;

                    standings.forEach(team => {
                        // Берем данные из правильных полей по документации API-Football
                        const logo = team.team.logo;
                        const name = team.team.name;
                        const games = team.all.played;
                        const wins = team.all.win;
                        const draws = team.all.draw;
                        const losses = team.all.lose;
                        const gf = team.all.goals.for;
                        const ga = team.all.goals.against;
                        const gd = team.goalsDiff;
                        const points = team.points;

                        html += `
                            <tr>
                                <td><strong>${team.rank}</strong></td>
                                <td><img src="${logo}" alt="${name}"> ${name}</td>
                                <td>${games}</td>
                                <td>${wins}</td>
                                <td>${draws}</td>
                                <td>${losses}</td>
                                <td>${gf} - ${ga}</td>
                                <td>${gd}</td>
                                <td><strong>${points}</strong></td>
                            </tr>
                        `;
                    });

                    html += `</tbody></table>`;
                    results.innerHTML = html;
                } else {
                    errorDiv.textContent = '❌ Данные не найдены для этого сезона/лиги.';
                    errorDiv.style.display = 'block';
                }
            } catch (e) {
                errorDiv.textContent = '❌ Ошибка при подключении к серверу.';
                errorDiv.style.display = 'block';
            } finally {
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
